name: Release Diagnostic Lab signed build

# Produces the signed Android App Bundle (.aab) Play Store actually requires, plus a signed
# APK for sideloading onto a real device to verify before submitting. Deliberately separate
# from build-diagnostic-lab-apk.yml (which builds an unsigned debug APK on every push) — a
# release signing run should be a deliberate action, not something that fires on every commit.
#
# Needs four repository secrets (Settings > Secrets and variables > Actions, this repo):
#   RELEASE_KEYSTORE_BASE64   — `base64 -w0 diagnosticlab-release.keystore` output
#   RELEASE_KEYSTORE_PASSWORD — the keystore's single PKCS12 password (store and key share one)
#   RELEASE_KEY_ALIAS         — diagnosticlab-release
# Without them, the build.gradle.kts release signingConfig is never attached and this
# workflow's build step fails with Gradle's own "keystore not found" error rather than
# producing an unsigned (and therefore Play-Store-unusable) artifact.
on:
  workflow_dispatch:
  push:
    tags:
      - "diagnostic-lab-v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diagnostic-lab-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      # Decoded to $RUNNER_TEMP (outside the checkout entirely, auto-cleaned with the runner)
      # rather than anywhere under diagnostic-lab-app/, so there's no path by which a later git
      # step in this or any other job could ever pick it up.
      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set — see this workflow file's header comment."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release AAB and APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: gradle bundleRelease assembleRelease --stacktrace

      - name: Upload signed AAB (what Play Store needs)
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-lab-release-aab
          path: diagnostic-lab-app/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload signed APK (for sideloading onto a real device to verify first)
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-lab-release-apk
          path: diagnostic-lab-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Unlike the debug APK workflow, this is a real production-signed artifact — it is
      # deliberately NOT mirrored to any git branch (ci-apk or otherwise). It only ever lives
      # in this run's own Actions artifact storage, downloaded directly from the Actions run
      # page by whoever has access to this repo.
