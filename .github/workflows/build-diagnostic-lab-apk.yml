name: Build Diagnostic Lab debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/diagnostic-lab-marketplace-app-**"
    paths:
      - "diagnostic-lab-app/**"
      - ".github/workflows/build-diagnostic-lab-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diagnostic-lab-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners already ship a licensed Android SDK (cmdline-tools,
      # platform-tools, common platforms/build-tools) — AGP downloads anything else
      # it needs (e.g. platform 34) during the build itself, licenses pre-accepted.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-lab-debug-apk
          path: diagnostic-lab-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
