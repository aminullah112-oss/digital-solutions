name: Build Diagnostic Lab debug APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/diagnostic-lab-marketplace-app-**"
    paths:
      - "diagnostic-lab-app/**"
      - ".github/workflows/build-diagnostic-lab-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diagnostic-lab-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners already ship a licensed Android SDK (cmdline-tools,
      # platform-tools, common platforms/build-tools) — AGP downloads anything else
      # it needs (e.g. platform 34) during the build itself, licenses pre-accepted.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-lab-debug-apk
          path: diagnostic-lab-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api30-google_apis-x86_64

      # Boots a real emulator, runs the full Compose UI walkthrough test against it
      # (FullAppWalkthroughTest), and pulls whatever screenshots it managed to capture —
      # continue-on-error + `|| true` inside the script so a test failure partway through
      # still leaves earlier screenshots on disk to upload instead of losing everything.
      - name: Run UI walkthrough and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          disk-size: 6000M
          heap-size: 600M
          # Each line of `script` runs as its own separate shell (not one continuous
          # session), so `cd` on one line does not carry over to the next — `gradle -p`
          # points at the project directory instead of relying on cwd.
          #
          # Deliberately NOT using `gradle connectedDebugAndroidTest`: that task uninstalls
          # both the app and test APKs the moment the instrumentation run finishes, win or
          # lose — confirmed via logcat on prior CI runs ("ActivityManager: Force stopping
          # ... deletePackageX" / "pkg removed" fire seconds after test completion). That wipes
          # the app's external files dir, where screenshots land, before any later step can
          # pull them — and the documented `-Pandroid.injected.androidTest.leaveApksInstalled`
          # workaround for this did not actually stop it. Driving install + `am instrument`
          # directly instead means nothing auto-uninstalls anything: the emulator (and its
          # disk) is thrown away at the end of the job regardless, so there's no cleanup to do.
          script: |
            gradle -p diagnostic-lab-app assembleDebug assembleDebugAndroidTest --stacktrace
            adb install -r diagnostic-lab-app/app/build/outputs/apk/debug/app-debug.apk
            adb install -r diagnostic-lab-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r com.digitalsolutions.diagnosticlab.test/androidx.test.runner.AndroidJUnitRunner > instrument_output.txt 2>&1 || true
            cat instrument_output.txt
            mkdir -p screenshots-pulled
            # The test run itself now succeeds end to end ("OK (1 test)") and the screenshots
            # directory genuinely exists, but a plain `adb pull` as the unprivileged shell user
            # hits scoped-storage permission checks reading another app's external-files dir
            # ("Permission denied", confirmed on a prior CI run) — these system images are
            # debuggable, so `adb root` re-execs adbd as root and clears that.
            adb root
            adb wait-for-device
            adb pull /sdcard/Android/data/com.digitalsolutions.diagnosticlab/files/screenshots screenshots-pulled || true
            adb logcat -d > logcat.txt || true
            echo "::group::App + test runner logcat (diagnostic — printed directly since the logcat artifact isn't reachable from this reviewer's environment)"
            grep -iE "diagnosticlab|AndroidJUnitRunner|TestRunner|AndroidRuntime|FATAL EXCEPTION|DEBUG_REVIEW_SCREEN" logcat.txt | tail -300 || true
            echo "::endgroup::"

      # Actions artifacts are served through short-lived signed Azure Blob Storage URLs,
      # which the reviewer's own environment cannot reach (its egress proxy denies that host
      # by policy). Pushing the screenshots to an ordinary git branch instead makes them
      # readable through the same plain `git fetch`/`git show` path already used for this
      # branch's own commits, no download step required.
      - name: Publish screenshots to ci-screenshots branch
        if: always()
        run: |
          if [ -d screenshots-pulled ] && [ -n "$(find screenshots-pulled -type f 2>/dev/null)" ]; then
            mkdir -p /tmp/shots
            cp -r screenshots-pulled/* /tmp/shots/
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout --orphan ci-screenshots-tmp
            git rm -rf . > /dev/null
            cp -r /tmp/shots/* .
            git add -A
            git commit -m "CI screenshots for run ${{ github.run_id }}"
            git push origin HEAD:refs/heads/ci-screenshots --force
          else
            echo "No screenshots captured this run — nothing to publish."
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-lab-screenshots
          path: screenshots-pulled/**
          if-no-files-found: warn

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-lab-logcat
          path: logcat.txt
          if-no-files-found: warn

      - name: Upload instrumentation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-lab-ui-test-report
          path: instrument_output.txt
          if-no-files-found: warn
