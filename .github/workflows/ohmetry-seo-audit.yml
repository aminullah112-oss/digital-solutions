name: Ohmetry SEO audit

# Read-only: crawls ohmetry.com, writes reports as a build artifact.
# It never commits, deploys, or changes the website.

on:
  schedule:
    - cron: "17 3 * * 1"  # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Max pages to crawl"
        default: "2000"
      pagespeed:
        description: "Run PageSpeed Insights (needs PAGESPEED_API_KEY secret)"
        type: boolean
        default: true
  push:
    paths:
      - "ohmetry-seo-engine/**"
      - ".github/workflows/ohmetry-seo-audit.yml"

permissions:
  contents: read

concurrency:
  group: ohmetry-seo-audit
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ohmetry-seo-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ohmetry-seo-engine/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q

  audit:
    needs: test
    # Tests run on every push; the live crawl only runs on schedule or on demand.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ohmetry-seo-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ohmetry-seo-engine/pyproject.toml
      - run: pip install -e .
      - name: Crawl and audit
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '2000' }}
          RUN_PSI: ${{ github.event_name == 'schedule' || github.event.inputs.pagespeed == 'true' }}
        run: |
          args=(audit --out reports/generated/latest --max-pages "$MAX_PAGES" -v)
          if [[ "$RUN_PSI" == "true" && -n "$PAGESPEED_API_KEY" ]]; then args+=(--pagespeed); fi
          ohmetry-seo "${args[@]}"
          cat reports/generated/latest/baseline-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ohmetry-seo-reports-${{ github.run_number }}
          path: |
            ohmetry-seo-engine/reports/generated/latest
            ohmetry-seo-engine/data/snapshots
          retention-days: 90
