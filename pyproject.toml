[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ohmetry-dc"
version = "0.1.0.dev0"
description = "Ohmetry 2 MW data centre electrical engineering project package (educational and preliminary reference). Stage 1: configuration and validation."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "PyYAML>=6.0", "openpyxl>=3.1", "reportlab>=4.0", "python-docx>=1.1"]
authors = [{ name = "Ohmetry" }]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ohmetry-dc = "ohmetry_dc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
