server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Uploaded schematics are the largest thing that crosses this proxy. A
    # multi-sheet drawing set runs to tens of megabytes.
    client_max_body_size 64m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Content-hashed assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Report export and schematic analysis are synchronous and can run
        # past the default 60s on a large drawing set.
        proxy_read_timeout 180s;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Live values tick every poll interval; this only has to outlast a
        # quiet period, not the session.
        proxy_read_timeout 3600s;
    }

    # Client-side routing: every unknown path is a React route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
