<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ARR Lead Engine</title>
<style>
:root{--bg:#07111f;--panel:#0c1b2c;--panel2:#102238;--line:#203852;--text:#eef6ff;--muted:#91a6bf;--a:#5eead4;--b:#60a5fa;--warn:#fbbf24;--bad:#fb7185;--ok:#34d399}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#07111f;color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:220px;background:#071523;border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh;flex:none}
.brand{font-size:19px;font-weight:800;padding:6px 10px 18px}.brand small{display:block;color:var(--a);font-size:10px;letter-spacing:1.5px;margin-top:3px}
.nav button{display:flex;gap:9px;width:100%;background:none;border:0;color:var(--muted);text-align:left;padding:10px 12px;border-radius:9px;margin:2px 0;cursor:pointer}
.nav button.active,.nav button:hover{background:#10273e;color:#fff}
.nav .badge{margin-left:auto;background:var(--bad);color:#000;border-radius:9px;padding:0 7px;font-size:11px;font-weight:700}
.main{flex:1;min-width:0;max-width:1200px;margin:0 auto;padding:22px 22px 90px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
h1{margin:0;font-size:24px}h2{font-size:17px;margin:0 0 10px}h3{margin:0 0 10px;font-size:15px}
.sub,.muted{color:var(--muted)}.sub{margin-top:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
.kpi{padding:12px}.kpi .n{font-size:24px;font-weight:800;margin:2px 0}
.btn{background:#12304a;border:1px solid #27506f;border-radius:9px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#17405f}.btn.primary{background:var(--a);color:#032;border-color:var(--a);font-weight:700}
.btn.good{background:#0f5b43;border-color:#1c8a66}.btn.danger{background:#5a1d2b;border-color:#8a2d40}.btn.small{padding:5px 9px;font-size:12px}.btn.wa{background:#128c4a;border-color:#1ab863;font-weight:700}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{background:#08192a;border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%}
textarea{resize:vertical;min-height:70px}label{display:block;color:var(--muted);font-size:12px;margin:0 0 4px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.toolbar>*{width:auto;flex:1 1 140px}.toolbar input{flex:2 1 220px}
.pill{display:inline-block;background:#12304a;border:1px solid #27506f;border-radius:999px;padding:1px 9px;font-size:12px}
.sc{display:inline-block;min-width:34px;text-align:center;border-radius:7px;padding:1px 6px;font-weight:800;font-size:12px}
.sc.hi{background:#0f5b43;color:#a7f3d0}.sc.mid{background:#5b4a0f;color:#fde68a}.sc.lo{background:#3a2430;color:#fda4af}
.bad{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}
.group{margin:0 0 20px}.group>h2{display:flex;align-items:center;gap:8px}.group>h2 .cnt{background:#12304a;border-radius:999px;font-size:12px;padding:1px 9px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.row.pending{border-color:var(--warn)}.rmain{min-width:0;flex:1;cursor:pointer}.rmain b{overflow-wrap:anywhere}.racts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.bar{height:9px;background:#0a1e31;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--a))}
.brow{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;margin:7px 0}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:10px;overflow-x:auto;padding-bottom:10px}
.col{background:#0a1a2b;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px}.col .mini{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:8px;cursor:pointer}
.tip{border-left:3px solid var(--b);background:#0a1e31;padding:8px 12px;border-radius:0 9px 9px 0;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.tip.warn{border-color:var(--warn)}.tip.bad{border-color:var(--bad)}.tip.good{border-color:var(--ok)}
.banner{position:sticky;top:0;z-index:20;background:#3a2f0c;border:1px solid var(--warn);border-radius:12px;padding:8px 12px;margin-bottom:14px;max-height:190px;overflow:auto}
.banner .row{background:transparent;border:0;padding:4px 0;margin:0}
.modal{position:fixed;inset:0;background:rgba(2,8,16,.75);display:none;align-items:flex-start;justify-content:center;padding:4vh 10px;overflow:auto;z-index:50}.modal.show{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:900px}
.tl{max-height:340px;overflow:auto}.ev{border-left:2px solid var(--line);padding:2px 0 8px 10px;margin-left:4px}.ev .t{color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#12304a;border:1px solid #27506f;padding:10px 16px;border-radius:10px;display:none;z-index:99;max-width:90vw}.toast.show{display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips .btn{padding:6px 10px}.chips .btn.sel{background:var(--a);color:#032;border-color:var(--a)}
.prog{height:12px;background:#0a1e31;border-radius:12px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok)}
pre.msg{white-space:pre-wrap;background:#08192a;border:1px solid var(--line);border-radius:9px;padding:10px;margin:0;font:inherit}
.opp{color:#a7f3d0;margin-top:3px}.pill.warn{border-color:var(--warn);color:var(--warn)}
.empty{color:var(--muted);padding:14px;text-align:center}
.mobilenav{display:none}
@media(max-width:820px){
 .side{display:none}
 .mobilenav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#071523;border-top:1px solid var(--line);z-index:30;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
 .mobilenav button{flex:1;background:none;border:0;color:var(--muted);padding:7px 2px;font-size:11px;position:relative}
 .mobilenav button.active{color:var(--a)}.mobilenav button span{display:block;font-size:17px}
 .mobilenav .badge{position:absolute;top:1px;right:14%;background:var(--bad);color:#000;border-radius:9px;padding:0 5px;font-size:10px;font-weight:700}
 .main{padding:14px 12px 96px}.g2,.g3,.g4,.form{grid-template-columns:1fr}.g6{grid-template-columns:repeat(2,1fr)}.full{grid-column:auto}
 .row{flex-direction:column;align-items:stretch}.racts{justify-content:flex-start}.racts .btn{flex:1}
 .brow{grid-template-columns:100px 1fr 70px}
}
</style>
</head>
<body>
<div class="app">
 <aside class="side"><div class="brand">ARR Lead Engine<small>V11 · SALES OS</small></div><div class="nav" id="nav"></div></aside>
 <main class="main"><div id="banner"></div><div id="view"></div></main>
</div>
<nav class="mobilenav" id="mnav"></nav>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =====================================================================
   ARR Lead Engine V11
   Data lives in localStorage (one key). Optional: Supabase sync, backend
   helper (Places discovery, website audit).  No build step, no framework.
   ===================================================================== */
const KEY = 'arr_lead_engine_v11';
const LEGACY_KEYS = ['arr_lead_engine_v8'];
const STAGES = ['New', 'Qualified', 'Contacted', 'Replied', 'Meeting', 'Proposal', 'Won', 'Nurture', 'Lost', 'Not Interested'];
const RANK = { New: 0, Qualified: 1, Contacted: 2, Replied: 3, Meeting: 4, Proposal: 5, Won: 6 };
const OPEN = ['New', 'Qualified', 'Contacted', 'Replied', 'Meeting', 'Proposal', 'Nurture'];
const PROB = { New: .02, Qualified: .04, Contacted: .06, Replied: .2, Meeting: .4, Proposal: .55, Nurture: .03, Won: 1 };
const CADENCE_STAGES = ['New', 'Qualified', 'Contacted', 'Nurture'];      // stages driven by the automatic cadence
const LOST_REASONS = ['Price too high', 'No budget', 'Already has a vendor', 'Not interested', 'No response after full cadence', 'Wrong number / closed', 'Other'];
const REPLY_CLASSES = {
  interested: 'Interested', meeting: 'Wants meeting / call', price: 'Asked price',
  later: 'Later / not now', no: 'Not interested', wrong: 'Wrong number'
};

const DEFAULT_SETTINGS = {
  me: 'Amin', brand: 'ARR Digital Solutions', portfolio: '', dailyNew: 20, nurtureDays: 60, defaultValue: 25000,
  backend: '', token: '', placesKey: '', ghRepo: 'aminullah112-oss/digital-solutions', ghBase: 'master', ghToken: '', myPhone: '',
  areas: ['Melvisharam', 'Ambur', 'Vaniyambadi', 'Ranipet', 'Vellore', 'Chennai'],
  cadence: [
    { wait: 0, ch: 'whatsapp', tpl: 'intro' },
    { wait: 2, ch: 'whatsapp', tpl: 'fu1' },
    { wait: 3, ch: 'call', tpl: 'call' },
    { wait: 4, ch: 'whatsapp', tpl: 'proof' },
    { wait: 5, ch: 'whatsapp', tpl: 'breakup' }
  ],
  templates: [
    { id: 'intro', name: 'Intro (English)', body: "Hello {name} team, this is {me} from {brand}. I found {name} on Google Maps. {hook}\n\nWe build {angle} for local businesses like yours. May I send you a free 1-minute sample made for {name}?\n\n(Reply STOP if you'd rather not hear from me.)" },
    { id: 'intro_ta', name: 'Intro (Tamil) — have a native speaker check', body: "வணக்கம் {name} குழுவினருக்கு, நான் {me}, {brand}-ல் இருந்து. Google Maps-ல் {name}-ஐ பார்த்தேன். {name}-க்காக {angle} உருவாக்கித் தர முடியும். இலவசமாக ஒரு சிறிய sample அனுப்பலாமா?\n\n(வேண்டாம் என்றால் STOP என்று பதிலளிக்கவும்.)" },
    { id: 'fu1', name: 'Follow-up 1 (idea + ask)', body: "Hello {name} team, {me} from {brand} again. I sketched an idea for {name}: {angle}.\n\nShall I send the sample here on WhatsApp? Just reply YES." },
    { id: 'call', name: 'Call script', body: "CALL SCRIPT\n1. Greet, say who you are and that you found them on Google Maps.\n2. Ask: \"Who looks after enquiries / your online presence?\"\n3. Hook: {hook}\n4. Ask permission to WhatsApp a free sample.\n5. Log the outcome here straight after the call." },
    { id: 'proof', name: 'Proof / portfolio', body: "Hello {name} team, {me} from {brand}. Here are sites we've built for local businesses: {portfolio}\n\nWe can do the same for {name}. Want me to prepare a free mock-up with your name and products?" },
    { id: 'breakup', name: 'Last message (soft close)', body: "Hello {name} team, I'll stop messaging now so I don't crowd your inbox. If a website or more online enquiries ever become a priority, just reply here and I'll pick it up.\n\nWishing {name} a great season. — {me}, {brand}" },
    { id: 'reengage', name: 'Re-engage (after nurture)', body: "Hello {name} team, {me} from {brand} — it's been a while. {hook}\n\nIs a website / more online enquiries worth a quick chat now? (Reply STOP to opt out.)" },
    { id: 'price', name: 'Reply: pricing', body: "Thanks for getting back, {name} team! Our packages:\n{packages}\n\nFinal price depends on pages and content, and I'm happy to fit your budget. Can we do a quick 10-minute call today or tomorrow?" },
    { id: 'meeting', name: 'Reply: book a call/visit', body: "Great! What time suits you for a 10-minute call or a visit this week? I'll bring a sample made for {name}." },
    { id: 'sitedemo', name: 'Sample website + proposal', body: "Hello {name} team, {me} from {brand}. I made a sample website for {name} so you can see what it could look like:\n{sitelink}\n\nIt has your call and WhatsApp buttons, your Google rating and your location. If you like it, we can put it on your own domain with your real photos and products.\n{packages}\n\nCan I call you this week to hear what you'd change?\n(Reply STOP if you'd rather not hear from me.)" },
    { id: 'fu_demo', name: 'Follow-up after sample website', body: "Hello {name} team, {me} from {brand} again. Did you get a chance to look at the sample website I made for {name}?\n{sitelink}\n\nHappy to change the colours, add your photos and products, and launch it on your own domain." },
    { id: 'chase', name: 'Proposal chase', body: "Hello {name} team, just checking whether you had a chance to look at the proposal. Happy to adjust scope or budget. Shall we finalise this week?" }
  ],
  packages: [
    { id: 'starter', name: 'Starter', price: 15000, desc: 'One-page website, WhatsApp enquiry button, Google Maps, mobile-friendly' },
    { id: 'business', name: 'Business', price: 30000, desc: 'Up to 5 pages, product/service catalogue, enquiry form, basic SEO' },
    { id: 'growth', name: 'Growth', price: 50000, desc: 'Business + Google Business Profile setup + WhatsApp catalogue + 3 months support' }
  ],
  rules: [
    { label: 'Manufacturer / exporter', match: 'leather|shoe|footwear|manufactur|factory|export|garment|textile|sheet ?metal|fabricat|engineering|industr', weight: 15, angle: 'a product-catalogue website that buyers and agents can browse and enquire from, with a WhatsApp enquiry button' },
    { label: 'Clinic / health', match: 'clinic|hospital|dental|doctor|pharma|diagnostic|lab\\b|scan', weight: 12, angle: 'an appointment page with WhatsApp booking and directions' },
    { label: 'Food / hospitality', match: 'restaurant|hotel|biryani|cafe|bakery|sweet|catering|mess\\b', weight: 10, angle: 'a menu and order-enquiry page linked to WhatsApp' },
    { label: 'Education', match: 'school|college|academy|coaching|institute|tuition|training', weight: 10, angle: 'an admissions-enquiry website with fee details and WhatsApp contact' },
    { label: 'Retail / trade', match: 'shop|store|mart|jewel|fashion|furniture|hardware|electronics|trader|supplier', weight: 8, angle: 'a product showcase site with WhatsApp ordering' }
  ],
  cloud: { url: '', key: '', email: '', session: null }
};
const FALLBACK_RULE = { label: 'Other', weight: 3, angle: 'a simple, mobile-friendly website with WhatsApp enquiry and Google Maps directions' };

/* ------------------------------------------------------------ helpers */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '₹' + Number(n || 0).toLocaleString('en-IN');
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (n, from = new Date()) => { const d = new Date(from); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / 864e5);
const nowIso = () => new Date().toISOString();
const uid = () => 'L' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
const fixUrl = u => { u = String(u || '').trim(); return u && !/^https?:\/\//i.test(u) ? 'https://' + u : u; };
function dueLabel(d) {
  if (!d) return 'no date';
  const n = daysBetween(today(), d);
  return n < 0 ? `${-n}d overdue` : n === 0 ? 'today' : n === 1 ? 'tomorrow' : `in ${n}d`;
}
function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 60 ? `${Math.max(m, 0)}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`;
}
let toastTimer;
function toast(s) { const t = $('#toast'); t.textContent = s; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600); }

/* Phones: store as +<country><number>. Bare 10-digit numbers are assumed Indian. */
function normPhone(p) {
  let d = String(p || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('00')) d = d.slice(2);
  else if (d.length === 11 && d[0] === '0') d = '91' + d.slice(1);
  else if (d.length === 10) d = '91' + d;
  return '+' + d;
}
const isMobile = p => !/^\+91/.test(p) || /^\+91[6-9]\d{9}$/.test(p);   // Indian landlines can't use WhatsApp
const waOK = l => !!l.phone && !l.phoneBad && !l.dnc && isMobile(l.phone);
const dialOK = l => !!l.phone && !l.phoneBad && !l.dnc;

/* ------------------------------------------------------------- storage */
let S = structuredClone(DEFAULT_SETTINGS);
let db = [];
let M = { lastBackup: '', lastPull: '', lastPush: '', created: nowIso() };

let quiet = false;
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify({ v: 11, leads: db, settings: S, meta: M })); }
  catch (e) { toast('Could not save — browser storage is full or blocked. Export a backup now.'); }
}
function save() { persist(); if (!quiet) scheduleSync(); }
function commit(l) { l.updated = nowIso(); save(); }
const L = () => db.filter(l => !l.deleted);
const byId = id => db.find(l => l.id === id && !l.deleted);

function newLead(o = {}) {
  const t = nowIso();
  const l = {
    id: /^[\w-]+$/.test(o.id || '') ? o.id : uid(), name: '', industry: '', area: '', address: '', phone: '', email: '', website: '',
    placeId: '', mapsUrl: '', source: 'Manual', rating: 0, reviews: 0, status: 'New', peak: 0, created: t, updated: t,
    value: 0, proposalValue: 0, nextAction: 'Send first message', nextDate: today(), step: 0, cycles: 0, callTries: 0,
    dnc: false, phoneBad: false, notes: '', lostReason: '', lastTpl: '', audit: null, pending: null, activities: [], ...o
  };
  l.id = /^[\w-]+$/.test(l.id) ? l.id : uid();
  l.phone = normPhone(l.phone);
  l.website = fixUrl(l.website);
  l.rating = Number(l.rating) || 0; l.reviews = Number(l.reviews) || 0;
  if (!l.value) l.value = ruleFor(l).value || S.defaultValue;
  if (!Array.isArray(l.activities)) l.activities = [];
  return l;
}
function load() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { /* corrupted: fall through */ }
  if (raw && raw.v === 11) {
    S = mergeSettings(raw.settings); db = raw.leads || []; M = { ...M, ...(raw.meta || {}) };
    return;
  }
  for (const k of LEGACY_KEYS) {
    try {
      const old = JSON.parse(localStorage.getItem(k) || 'null');
      if (Array.isArray(old) && old.length) { db = migrateLegacy(old); M.migrated = k; save(); return; }
    } catch (e) { /* ignore */ }
  }
}
function mergeSettings(s) {
  const out = { ...structuredClone(DEFAULT_SETTINGS), ...(s || {}) };
  out.cloud = { ...DEFAULT_SETTINGS.cloud, ...((s || {}).cloud || {}) };
  for (const t of DEFAULT_SETTINGS.templates) if (!out.templates.some(x => x.id === t.id)) out.templates.push(structuredClone(t));
  return out;
}

/* V8/V9/V10 -> V11 */
function migrateLegacy(arr) {
  const stageMap = {
    'Discovered': 'New', 'Researching': 'New', 'Qualified': 'Qualified', 'Ready to Contact': 'Qualified', 'Contacted': 'Contacted',
    'Follow-up 1': 'Contacted', 'Follow-up 2': 'Contacted', 'Responded': 'Replied', 'Interested': 'Replied', 'Meeting': 'Meeting',
    'Proposal Sent': 'Proposal', 'Negotiation': 'Proposal', 'Won': 'Won', 'Lost': 'Lost', 'Not Interested': 'Not Interested'
  };
  const actMap = { 'Outreach Sent': 'Message Sent', 'Follow-up Sent': 'Message Sent', 'Response Received': 'Reply' };
  return arr.filter(o => o && o.name).map(o => {
    const acts = (o.activities || []).filter(a => a.type !== 'WhatsApp Opened').map(a => ({
      type: actMap[a.type] || a.type, at: a.at || nowIso(), note: a.note || '', channel: a.channel || '', ...(actMap[a.type] === 'Reply' ? { cls: 'interested' } : {})
    }));
    const sent = acts.filter(a => a.type === 'Message Sent').length;
    const status = stageMap[o.status] || 'New';
    const l = newLead({
      id: o.id, name: o.name, industry: o.industry || '', area: o.area || '', phone: o.phone || '', website: o.website || '', placeId: o.placeId || '',
      source: o.source || 'Imported (legacy)', rating: o.rating, reviews: o.reviews, status, created: o.created || nowIso(),
      value: Number(o.value) || 0, proposalValue: Number(o.proposalValue) || 0, lostReason: o.lostReason || '', notes: o.response || '',
      activities: acts, step: Math.min(sent, S.cadence.length - 1), lastTpl: sent ? 'intro' : '',
      nextAction: o.nextAction || 'Follow up', nextDate: o.nextActionDate ? ymd(new Date(o.nextActionDate)) : (OPEN.includes(status) ? today() : ''),
      dnc: status === 'Not Interested'
    });
    l.peak = Math.max(RANK[status] ?? 0, acts.some(a => a.type === 'Reply') ? 3 : 0, sent ? 2 : 0);
    return l;
  });
}

/* -------------------------------------------------- scoring & messages */
function ruleFor(l) {
  const hay = `${l.industry} ${l.name}`.toLowerCase();
  for (const r of S.rules) { try { if (new RegExp(r.match, 'i').test(hay)) return r; } catch (e) { /* bad regex in settings */ } }
  return FALLBACK_RULE;
}
/* ---- Website triage + opportunity (what's missing, what ARR can sell) ---- */

  }
  return Object.entries(m).map(([id, s]) => ({ id, name: (S.templates.find(t => t.id === id) || { name: id }).name, ...s, rate: pct(s.replies, s.sent) })).sort((a, b) => b.sent - a.sent);
}
function groupStats(keyFn) {
  const m = {};
  for (const l of L()) {
    const k = keyFn(l) || 'Unknown', g = (m[k] ||= { k, leads: 0, contacted: 0, replied: 0, won: 0, rev: 0 });
    g.leads++; if ((l.peak ?? 0) >= 2) g.contacted++; if ((l.peak ?? 0) >= 3) g.replied++;
    if (l.status === 'Won') { g.won++; g.rev += Number(l.proposalValue || l.value || 0); }
  }
  return Object.values(m).sort((a, b) => b.leads - a.leads);
}
function funnel() {
  const ls = L(), reached = r => ls.filter(l => (l.peak ?? 0) >= r).length;
  return [['Leads', ls.length], ['Contacted', reached(2)], ['Replied', reached(3)], ['Meeting', reached(4)], ['Proposal', reached(5)], ['Won', reached(6)]];
}

let placesFound = [];
const ALIAS = {
  name: ['name', 'business', 'business name', 'company', 'title', 'shop'], phone: ['phone', 'mobile', 'contact number', 'whatsapp', 'phone number', 'international phone number', 'national phone number', 'mobile number', 'tel'],
  industry: ['industry', 'category', 'type', 'segment'], area: ['area', 'city', 'location', 'locality', 'town'], address: ['address', 'formatted address'],
  website: ['website', 'url', 'site', 'web', 'websiteuri'], rating: ['rating'], reviews: ['reviews', 'user ratings', 'review count', 'userratingcount', 'ratings'],
  email: ['email', 'e-mail', 'mail'], notes: ['notes', 'message', 'interest', 'remarks', 'comments'], placeId: ['placeid', 'place id'], contact: ['contact', 'contact person']
};
function parseTable(text) {
  text = text.replace(/^﻿/, '').trim(); if (!text) return [];
  const delim = text.split('\n')[0].includes('\t') ? '\t' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); cell = ''; if (row.some(x => x.trim())) rows.push(row); row = []; }
    else cell += c;
  }
  row.push(cell); if (row.some(x => x.trim())) rows.push(row);
  const heads = rows[0].map(h => h.trim().toLowerCase());
  const hasCompany = heads.includes('company');
  const canon = h => { if (hasCompany && h === 'name') return 'contact'; if (hasCompany && h === 'company') return 'name'; for (const k in ALIAS) if (ALIAS[k].includes(h)) return k; return null; };
  const map = heads.map(canon);
  const headed = map.includes('name') || map.includes('phone');
  const cols = headed ? map : ['name', 'phone', 'industry', 'area'];
  return rows.slice(headed ? 1 : 0).map(r => { const o = {}; r.forEach((v, i) => { if (cols[i] && v.trim() && !(cols[i] in o)) o[cols[i]] = v.trim(); }); return o; }).filter(o => o.name);
}
function dupKeys(l) {
  const k = [], d = String(l.phone || '').replace(/\D/g, '');
  if (d.length >= 10) k.push('t:' + d.slice(-10));
  if (l.placeId) k.push('p:' + l.placeId);
  k.push('n:' + String(l.name).toLowerCase().replace(/[^a-z0-9]/g, '') + '|' + String(l.area || '').toLowerCase().replace(/[^a-z0-9]/g, ''));
  return k;
}
function prepareImport(rows, { source, inbound, area }) {
  const seen = new Set(L().flatMap(dupKeys)), fresh = []; let dups = 0;
  for (const r of rows) {
    const base = { ...r, area: r.area || area || '', source: r.source || source || 'Import' };
    if (r.contact) base.notes = `Contact: ${r.contact}${r.notes ? '\n' + r.notes : ''}`;
    delete base.contact;
    const l = newLead(base);
    if (inbound) { l.status = 'Replied'; l.peak = 3; l.nextAction = 'Respond to enquiry now'; l.nextDate = today(); act(l, 'Inbound', { note: `Enquiry via ${l.source}${r.notes ? ': ' + r.notes.slice(0, 300) : ''}` }); }
    else act(l, 'Added', { note: `Source: ${l.source}` });
    const ks = dupKeys(l);
    if (ks.some(k => seen.has(k))) { dups++; continue; }
    ks.forEach(k => seen.add(k)); fresh.push(l);
  }
  return { fresh, dups };
}

/* ---------- Cloud sync (Supabase REST + GoTrue) */
const cloudOn = () => !!(S.cloud.url && S.cloud.key && S.cloud.session);
let syncTimer, syncing = false;
function scheduleSync() { if (!cloudOn() || quiet) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => A.cloudSync(true), 4000); }
async function sbToken() {
  const c = S.cloud, s = c.session;
  if (Date.now() < s.exp) return s.access;
  const r = await fetch(c.url + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: c.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: s.refresh }) });
  const j = await r.json();
  if (!r.ok) { c.session = null; persist(); throw new Error('Session expired — sign in again'); }
  c.session = { access: j.access_token, refresh: j.refresh_token, exp: Date.now() + j.expires_in * 1000 - 60000 }; persist();
  return c.session.access;
}
async function sb(path, opt = {}) {
  const c = S.cloud, tok = await sbToken();
  const r = await fetch(c.url + '/rest/v1/' + path, { ...opt, headers: { apikey: c.key, Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json', ...(opt.headers || {}) } });
  if (!r.ok) throw new Error((await r.text()).slice(0, 200));
  return r.status === 204 ? null : r.json();
}
function mergeLeads(remote) {
  let n = 0;
  for (const r of remote) {
    if (!r || !r.id || !r.name) continue;
    const i = db.findIndex(l => l.id === r.id);
    if (i < 0) { db.push(newLead(r)); n++; }
    else if ((r.updated || '') > (db[i].updated || '')) { db[i] = newLead(r); n++; }
  }
  return n;
}
async function cloudSync() {
  if (syncing) return; syncing = true;
  try {
    const q = 'leads?select=id,data,updated_at&order=updated_at.asc&limit=1000' + (M.lastPull ? '&updated_at=gt.' + encodeURIComponent(M.lastPull) : '');
    const rows = await sb(q);
    quiet = true; const merged = mergeLeads(rows.map(x => x.data)); quiet = false;
    if (rows.length) M.lastPull = rows[rows.length - 1].updated_at;
    const out = db.filter(l => (l.updated || '') > (M.lastPush || ''));
    for (let i = 0; i < out.length; i += 200) {
      await sb('leads?on_conflict=id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(out.slice(i, i + 200).map(l => ({ id: l.id, data: l, updated_at: l.updated }))) });
    }
    if (out.length) M.lastPush = out.reduce((m, l) => l.updated > m ? l.updated : m, M.lastPush || '');
    else if (!M.lastPush) M.lastPush = nowIso();
    persist();
    return { pulled: merged, pushed: out.length };
  } finally { syncing = false; quiet = false; }
}

/* ---- OpenStreetMap search: Nominatim (geocode area) + Overpass (features around it). Free, no key. ---- */
const OSM_CATS = {
  'Leather, shoes & footwear': ['["craft"~"shoemaker|leather"]', '["shop"~"leather|shoes|bag"]', '["industrial"~"leather|shoe"]', '["name"~"leather|shoe|footwear|tannery|tanners|chappal|sandal",i]'],
  'Factories & manufacturers': ['["man_made"="works"]', '["industrial"]', '["craft"]', '["office"="company"]["name"~"industries|exports|enterprises|manufactur|factory|works",i]'],
  'Restaurants, hotels & food': ['["amenity"~"restaurant|cafe|fast_food|food_court|ice_cream"]', '["tourism"~"hotel|guest_house|motel"]', '["shop"~"bakery|sweets|confectionery"]'],
  'Clinics & health': ['["amenity"~"clinic|hospital|doctors|dentist|pharmacy"]', '["healthcare"]'],
  'Schools & coaching': ['["amenity"~"school|college|kindergarten|language_school|university"]', '["office"="educational_institution"]'],
  'Hardware, building & electrical': ['["shop"~"hardware|doityourself|trade|electrical|paint|tiles"]', '["craft"~"carpenter|electrician|plumber|welder|metal_construction"]'],
  'Jewellery, clothes & textile': ['["shop"~"jewelry|clothes|fabric|tailor|boutique|shoes"]', '["craft"="tailor"]'],
  'All shops': ['["shop"]'],
  'Any named business with a phone': ['["phone"]["name"]', '["contact:phone"]["name"]', '["contact:mobile"]["name"]']
};
const OVERPASS = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'];
function parseOsm(elements, area) {
  const out = [], seen = new Set();
  for (const e of elements || []) {
    const t = e.tags || {}; if (!t.name) continue;
    const id = `osm:${e.type}/${e.id}`; if (seen.has(id)) continue; seen.add(id);
    const first = v => String(v || '').split(/[;,]/)[0].trim();
    const addr = ['addr:housenumber', 'addr:street', 'addr:suburb', 'addr:city'].map(k => t[k]).filter(Boolean).join(', ');
    const kind = t.craft || t.industrial || t.shop || t.amenity || t.healthcare || t.tourism || t.office || t.man_made || 'business';
    out.push({
      placeId: id, name: t.name, industry: String(kind).replace(/_/g, ' '), area, address: addr,
      phone: first(t.phone || t['contact:phone'] || t['contact:mobile'] || t.mobile), website: first(t.website || t['contact:website'] || t.url),
      email: first(t.email || t['contact:email']), rating: 0, reviews: 0,
      mapsUrl: `https://www.openstreetmap.org/${e.type}/${e.id}`, source: 'OpenStreetMap'
    });
  }
  return out;
}
async function osmSearch(cat, area, km) {
  const geo = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=in&q=' + encodeURIComponent(/india/i.test(area) ? area : area + ', Tamil Nadu, India'));
  if (!geo.ok) throw new Error('Could not look up the area (map service busy). Try again in a minute.');
  const g = (await geo.json())[0]; if (!g) throw new Error(`Could not locate "${area}" on the map. Try a nearby larger town.`);
  const around = `(around:${km * 1000},${g.lat},${g.lon})`;
  const q = `[out:json][timeout:45];(${OSM_CATS[cat].map(f => `nwr${f}${around};`).join('')});out center tags 400;`;
  let lastErr = 'Map data service is busy. Try again in a minute.';
  for (const url of OVERPASS) {
    try {
      const r = await fetch(url, { method: 'POST', body: 'data=' + encodeURIComponent(q), headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
      if (r.ok) {
        const els = (await r.json()).elements || [], places = parseOsm(els, area);
        return { places, meta: { where: (g.display_name || area).split(',').slice(0, 3).join(','), lat: (+g.lat).toFixed(3), lon: (+g.lon).toFixed(3), km, raw: els.length, named: places.length } };
      }
      lastErr = r.status === 429 || r.status === 504 ? 'Map data service is busy. Try again in a minute.' : 'Map data service error ' + r.status;
    } catch (e) { lastErr = 'Could not reach the map data service.'; }
  }
  throw new Error(lastErr);
}

async function gh(path, opt = {}) {

    if (r.status === 403) throw new Error('The GitHub token is not allowed to do that. It needs "Contents: Read and write" on this repository.' + (j.message ? ' (' + j.message.slice(0, 80) + ')' : ''));

  const cur = await gh(`/contents/${path}?ref=${branch}`, { allow404: true });

  const sha = put.body.commit.sha;
  l.lp = { ...(l.lp || {}), slug, branch, path, sha, status: 'preview', at: nowIso(), ...lpUrls(slug, branch, sha) };

/* Places search straight from the browser. The key is visible to anyone who can open devtools on this

const PLACES_FIELDS = 'places.id,places.displayName,places.formattedAddress,places.nationalPhoneNumber,places.internationalPhoneNumber,places.websiteUri,places.primaryTypeDisplayName,places.rating,places.userRatingCount,places.googleMapsUri,places.businessStatus,nextPageToken';
function placesError(status, j) {
  const m = ((j.error && j.error.message) || '').toLowerCase(), st = ((j.error && j.error.status) || '');
  if (/referer|referrer/.test(m)) return `Google blocked this address. Your key is limited to specific websites and this page isn't on the list. Open the CRM from https://aminullah112-oss.github.io/digital-solutions/arr-lead-engine/ (not a file or preview link), or add this address to the key's allowed websites.`;
  if (/has not been used|is disabled|not enabled|service_disabled/.test(m) || st === 'SERVICE_DISABLED') return 'Turn on "Places API (New)" for this Google Cloud project (Settings has the link), wait a minute, and retry.';
  if (/billing/.test(m)) return 'Google needs a billing account linked to this project. The monthly free allowance still applies. Link one in Google Cloud → Billing.';
  if (/api key not valid|invalid api key|api_key_invalid/.test(m) || status === 400 && /key/.test(m)) return 'Google says the key is not valid. Re-copy it with no spaces.';
  if (/api target blocked|api_key_service_blocked|are blocked/.test(m)) return 'The key is restricted to other APIs. Under API restrictions, allow "Places API (New)".';
  if (status === 429 || /quota|rate/.test(m)) return 'Google quota reached for now. Try later or check quotas in Google Cloud.';
  return 'Google Places error ' + status + (m ? ': ' + m.slice(0, 160) : '');

async function placesDirect(query, wanted) {
  const seen = new Set(), out = []; let token = '';

    const r = await fetch('https://places.googleapis.com/v1/places:searchText', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Goog-Api-Key': S.placesKey, 'X-Goog-FieldMask': PLACES_FIELDS }, body: JSON.stringify({ textQuery: query, pageSize: 20, ...(token ? { pageToken: token } : {}) }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(placesError(r.status, j));
    for (const p of j.places || []) {
      if (seen.has(p.id) || /^CLOSED/.test(p.businessStatus || '')) continue;
      seen.add(p.id);
      out.push({ placeId: p.id, name: (p.displayName || {}).text || '', industry: (p.primaryTypeDisplayName || {}).text || 'Other', area: p.formattedAddress || '', phone: p.internationalPhoneNumber || p.nationalPhoneNumber || '', website: p.websiteUri || '', rating: p.rating || 0, reviews: p.userRatingCount || 0, mapsUrl: p.googleMapsUri || '', source: 'Google Places' });

function psiError(status, m) {

  if (/blocked|api_key_service_blocked|referer|referrer/.test(m)) return 'Your key is not allowed to call PageSpeed Insights. In the key\'s API restrictions add "PageSpeed Insights API".';

async function psiAudit(url) {

  if (S.placesKey) q.set('key', S.placesKey);

async function auditLead(l) {
  if (!S.placesKey && !S.backend) throw new Error('To audit websites, add your Google key (Settings → Google Places) and enable PageSpeed Insights API');
  const kind = siteInfo(l).kind; if (kind === 'none') throw new Error('No website to audit'); if (kind === 'social') throw new Error('Only a social/directory page, nothing to audit');
  const parts = []; let shot = '', firstErr = '';

  if (S.backend) { try { parts.push((await api('/api/audit', { website: l.website })).audit); } catch (e) { firstErr = firstErr || e.message; } }

async function auditMany(list, workers = 3) {
  const todo = list.filter(l => ['real', 'builder'].includes(siteInfo(l).kind) && !l.audit); let n = 0, fail = 0, msg = '';

        return `<label class="row" style="align-items:flex-start;cursor:pointer;${p.dup ? 'opacity:.55' : ''}"><input type="checkbox" class="pf" data-i="${i}" style="width:auto;margin-top:5px" ${p.dup || !p.phone ? '' : 'checked'} ${p.dup ? 'disabled' : ''}>
        <div class="rmain" style="cursor:pointer"><b>${esc(p.name)}</b> ${scorePill(t)}${p.dup ? ' <span class="muted">· already in CRM</span>' : ''}
        <div class="muted">${esc(p.industry)} · ${p.phone ? esc(p.phone) : '<span class="warn">no phone</span>'}${p.reviews ? ` · ${p.rating}★ (${p.reviews})` : ''}</div>
        <div>🌐 ${siteLink(t)}</div>
        <div class="opp">💡 <b>${esc(op.headline)}</b>${top ? ': ' + esc(top.fix) : op.si.kind === 'real' && !op.audited ? '. Audit it after adding to see what is missing.' : ''}</div></div></label>`;
      }).join('') || '<div class="empty">No results</div>'}
      <div class="actions" style="margin-top:10px"><button class="btn primary" onclick="A.addFound()">Add selected</button>
      <label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="pf_audit" style="width:auto" ${canAudit ? 'checked' : 'disabled'}> Audit their websites after adding</label></div>
      <p class="muted">Ticked = has a phone and is new. ${canAudit ? '' : 'Website audits need your Google key (Settings) with PageSpeed Insights API enabled. '}Audits take 15–40 s per site and run in the background.</p>`;
    $('#pl_card').scrollIntoView({ behavior: 'smooth' });
  },
  async search() {
    const type = pickVal('pl_type'), area = pickVal('pl_area'); if (!type) return toast('Choose a business type'); if (!area) return toast('Choose an area');
    $('#pl_card').style.display = 'block'; $('#pl_res').innerHTML = '<div class="empty">Searching Google…</div>';
    try { A.showFound(await discoverPlaces(type, area, +val('pl_max')), area); }
    catch (e) { $('#pl_res').innerHTML = `<div class="tip bad"><span>${esc(e.message)}</span></div>`; }
  },
  async osmSearch() {
    const cat = pickVal('osm_cat'), area = pickVal('osm_area'); if (!cat) return toast('Choose a category'); if (!area) return toast('Choose an area');
    $('#pl_card').style.display = 'block'; $('#pl_res').innerHTML = '<div class="empty">Searching OpenStreetMap… this can take 10–30 seconds.</div>';
    try {
      const { places, meta } = await osmSearch(cat, area, +val('osm_rad'));
      A.showFound(places, area, `Searched ${meta.km} km around ${meta.where} (${meta.lat}, ${meta.lon}). The map matched ${meta.raw} feature(s), ${meta.named} with a name. ${meta.named < 10 ? 'OpenStreetMap has very little mapped here. Use Quick add or Google search instead.' : ''} Data © OpenStreetMap contributors (ODbL).`);
      toast(`${meta.named} found, ${places.filter(p => p.phone).length} with a phone`);
    }
    catch (e) { $('#pl_res').innerHTML = `<div class="tip bad"><span>${esc(e.message)}</span></div>`; }
  },
  addFound() {
    const rows = [...document.querySelectorAll('.pf')].filter(x => x.checked).map(x => placesFound[+x.dataset.i]);
    const { fresh, dups } = prepareImport(rows, { source: 'Map search' }); addLeads(fresh); toast(`Added ${fresh.length}${dups ? `, skipped ${dups} duplicate(s)` : ''}`);
    const wantAudit = $('#pf_audit') && $('#pf_audit').checked; render();
    if (wantAudit && fresh.some(l => ['real', 'builder'].includes(siteInfo(l).kind))) {
      toast('Auditing websites in the background…');
      auditMany(fresh).then(r => { toast(r.n ? `Audited ${r.n} website(s)${r.fail ? `, ${r.fail} failed` : ''}. See Leads.` : (r.msg || 'Nothing to audit')); if (page === 'leads') render(); });
    }
  },
  readFile(inp) { const f = inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $('#im_text').value = r.result; $('#im_src').value = f.name; }; r.readAsText(f); },
  previewImport() {
    const rows = parseTable(val('im_text')); if (!rows.length) return toast('Nothing to import — check the header row');
    const opts = { source: val('im_src') || 'Import', area: val('im_area'), inbound: $('#im_in').checked };
    const { fresh, dups } = prepareImport(rows, opts); window._imp = fresh;
    modal(`<h2>Import preview</h2><div class="grid g3"><div class="card kpi"><div class="muted">New</div><div class="n ok">${fresh.length}</div></div><div class="card kpi"><div class="muted">Duplicates skipped</div><div class="n">${dups}</div></div><div class="card kpi"><div class="muted">No phone</div><div class="n ${fresh.some(l => !l.phone) ? 'warn' : ''}">${fresh.filter(l => !l.phone).length}</div></div></div>
      <div class="tw"><table><thead><tr><th>Business</th><th>Phone</th><th>Industry</th><th>Fit</th></tr></thead><tbody>${fresh.slice(0, 25).map(l => `<tr><td>${esc(l.name)}</td><td>${esc(l.phone || '—')}</td><td>${esc(l.industry)}</td><td>${scorePill(l)}</td></tr>`).join('')}</tbody></table></div>${fresh.length > 25 ? `<div class="muted">…and ${fresh.length - 25} more</div>` : ''}
      <div class="actions" style="margin-top:12px"><button class="btn primary" ${fresh.length ? '' : 'disabled'} onclick="A.commitImport()">Import ${fresh.length}</button><button class="btn" onclick="closeModal()">Cancel</button></div>`);
  },
  commitImport() { addLeads(window._imp || []); toast(`Imported ${(window._imp || []).length}`); window._imp = null; closeModal(); go('today'); },
  importLegacy() {
    try {
      const arr = JSON.parse(val('im_old')); if (!Array.isArray(arr)) throw new Error('Expected a JSON array');
      const seen = new Set(L().flatMap(dupKeys)), fresh = migrateLegacy(arr).filter(l => !dupKeys(l).some(k => seen.has(k)));
      addLeads(fresh); toast(`Imported ${fresh.length} lead(s)`); go('today');
    } catch (e) { toast('Could not read that: ' + e.message); }
  },
  /* settings */
  saveSettings(quietly) {
    if (page !== 'settings') return true;
    let rules;
    try { rules = JSON.parse(val('s_rules')); if (!Array.isArray(rules)) throw 0; rules.forEach(r => new RegExp(r.match)); } catch (e) { toast('Industry rules must be valid JSON with valid regex'); return false; }
    S.me = val('s_me').trim() || 'Amin'; S.brand = val('s_brand').trim(); S.portfolio = safeUrl(val('s_port').trim()) ? val('s_port').trim() : (val('s_port').trim() ? 'https://' + val('s_port').trim() : '');
    S.dailyNew = Math.max(1, +val('s_daily') || 20); S.nurtureDays = Math.max(7, +val('s_nurt') || 60); S.defaultValue = +val('s_val') || 25000;
    S.areas = val('s_areas').split(',').map(x => x.trim()).filter(Boolean);
    S.placesKey = val('s_pk').trim(); S.ghRepo = val('s_ghr').trim() || S.ghRepo; S.ghBase = val('s_ghb').trim() || 'master'; S.ghToken = val('s_ght').trim(); S.myPhone = normPhone(val('s_myp')); S.rules = rules; S.backend = val('s_be').trim().replace(/\/$/, ''); S.token = val('s_tok').trim();
    S.cloud.url = val('c_url').trim().replace(/\/$/, ''); S.cloud.key = val('c_key').trim(); S.cloud.email = val('c_email').trim();
    const w = [...document.querySelectorAll('.cd_w')], c = [...document.querySelectorAll('.cd_c')], t = [...document.querySelectorAll('.cd_t')];
    S.cadence = S.cadence.map((_, i) => ({ wait: i === 0 ? 0 : Math.max(0, +w[i].value || 0), ch: c[i].value, tpl: t[i].value }));
    const tn = [...document.querySelectorAll('.t_name')], tb = [...document.querySelectorAll('.t_body')];
    S.templates = S.templates.map((x, i) => ({ ...x, name: tn[i].value, body: tb[i].value }));
    const pn = [...document.querySelectorAll('.p_name')], pp = [...document.querySelectorAll('.p_price')], pd = [...document.querySelectorAll('.p_desc')];
    S.packages = S.packages.map((x, i) => ({ ...x, name: pn[i].value, price: +pp[i].value || 0, desc: pd[i].value }));
    save(); if (!quietly) { toast('Settings saved'); render(); } return true;
  },
  cadAdd() { if (!A.saveSettings(true)) return; S.cadence.push({ wait: 3, ch: 'whatsapp', tpl: S.templates[0].id }); save(); render(); },
  cadDel() { if (!A.saveSettings(true)) return; S.cadence.pop(); if (!S.cadence.length) S.cadence = structuredClone(DEFAULT_SETTINGS.cadence).slice(0, 1); L().forEach(l => { if (l.step >= S.cadence.length) l.step = 0; }); save(); render(); },
  tplAdd() { if (!A.saveSettings(true)) return; S.templates.push({ id: 't' + Date.now().toString(36), name: 'New template', body: 'Hello {name} team, ' }); save(); render(); },
  tplDel(i) {
    if (!A.saveSettings(true)) return; const t = S.templates[i];
    if (S.cadence.some(c => c.tpl === t.id) || ['price', 'meeting', 'chase', 'reengage'].includes(t.id)) return toast('That template is used by the cadence or by a built-in action');
    S.templates.splice(i, 1); save(); render();
  },
  pkgAdd() { if (!A.saveSettings(true)) return; S.packages.push({ id: 'p' + Date.now().toString(36), name: 'New package', price: 0, desc: '' }); save(); render(); },
  pkgDel(i) { if (!A.saveSettings(true)) return; if (S.packages.length < 2) return toast('Keep at least one package'); S.packages.splice(i, 1); save(); render(); },
  async testKey() {
    if (!A.saveSettings(true)) return;
    if (!S.placesKey) return toast('Paste your key first');
    try { const r = await placesDirect('restaurant in Chennai', 1); toast(r.length ? 'Key works ✓ Google returned results' : 'Key accepted, but no results came back'); }
    catch (e) { toast(e.message); }
  },
  async health() { if (!A.saveSettings(true)) return; try { const r = await fetch(S.backend + '/health'); const j = await r.json(); toast(`Backend online · Places ${j.placesConfigured ? 'configured' : 'NOT configured'}${j.authRequired ? ' · token required' : ''}`); } catch (e) { toast('Backend unreachable'); } },
  async cloudLogin() {
    if (!A.saveSettings(true)) return; const c = S.cloud;
    try {
      const r = await fetch(c.url + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { apikey: c.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ email: c.email, password: val('c_pw') }) });
      const j = await r.json(); if (!r.ok) throw new Error(j.error_description || j.msg || 'Login failed');
      c.session = { access: j.access_token, refresh: j.refresh_token, exp: Date.now() + j.expires_in * 1000 - 60000 }; M.lastPull = ''; M.lastPush = ''; persist();
      const res = await cloudSync(); toast(`Signed in · pulled ${res.pulled}, pushed ${res.pushed}`); render();
    } catch (e) { toast(e.message); }
  },
  async cloudSync(silent) { try { const r = await cloudSync(); if (!silent) toast(`Synced · pulled ${r.pulled}, pushed ${r.pushed}`); if (!silent || page !== 'settings') render(); } catch (e) { if (!silent) toast('Sync failed: ' + e.message); else console.warn('sync', e); } },
  cloudLogout() { S.cloud.session = null; persist(); render(); },
  /* data */
  exportJSON() {
    const s = structuredClone(S); s.cloud.session = null; s.token = ''; s.placesKey = ''; s.ghToken = '';
    dl(`arr-lead-engine-backup-${today()}.json`, 'application/json', JSON.stringify({ v: 11, leads: db, settings: s }, null, 1)); M.lastBackup = nowIso(); persist(); toast('Backup downloaded'); render();
  },
  importJSON(inp) {
    const f = inp.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => {
      try {
        const j = JSON.parse(r.result); if (j.v !== 11 || !Array.isArray(j.leads)) throw new Error('Not a V11 backup');
        const n = mergeLeads(j.leads);
        if (j.settings && confirm('Also restore templates, packages and settings from the backup? (Backend token and cloud login are never restored.)')) { const keep = { token: S.token, placesKey: S.placesKey, ghToken: S.ghToken, cloud: S.cloud }; S = mergeSettings({ ...j.settings, ...keep }); }
        save(); toast(`Restored ${n} lead(s)`); render();
      } catch (e) { toast('Restore failed: ' + e.message); }
    }; r.readAsText(f);
  },
  exportCSV() {
    const cols = ['name', 'industry', 'area', 'phone', 'email', 'website', 'status', 'source', 'rating', 'reviews', 'value', 'proposalValue', 'nextAction', 'nextDate', 'lostReason', 'notes', 'created'];
    const cell = v => { v = String(v ?? ''); if (/^[=+\-@\t\r]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
    const rows = [['score', ...cols].join(','), ...L().map(l => [score(l), ...cols.map(c => l[c])].map(cell).join(','))];
    dl(`arr-leads-${today()}.csv`, 'text/csv', '﻿' + rows.join('\n'));
  },
  wipe() { if (confirm('Delete ALL leads and settings from this browser? Cloud copies (if any) stay.') && confirm('Really delete everything?')) { localStorage.removeItem(KEY); location.reload(); } }
};

/* ------------------------------------------------------------------ boot */
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('#modal').classList.contains('show') && page !== 'settings') render(); });
load(); render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
if (cloudOn()) A.cloudSync(true);
</script>
</body>
</html>
