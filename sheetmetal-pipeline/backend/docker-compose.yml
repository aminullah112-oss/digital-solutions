# Runs the build API behind Caddy for automatic HTTPS.
#
# Why HTTPS is not optional: the UI is served from GitHub Pages over
# HTTPS. Browsers block fetch()/XHR from an HTTPS page to a plain HTTP
# endpoint (mixed-content blocking, on by default in Chrome and Firefox) --
# "Generate real part" would silently fail from the live UI against a
# bare HTTP backend, not because of a code bug but because the browser
# refuses the request outright. Caddy gets a real Let's Encrypt cert
# automatically, as long as DOMAIN resolves to this host and ports 80/443
# are reachable from the internet.
#
# DOMAIN needs a hostname, not a bare IP (Let's Encrypt won't issue certs
# for IP addresses). If you don't own a domain, sslip.io gives you one for
# free: a VM at 203.0.113.10 gets DOMAIN=203-0-113-10.sslip.io, which
# resolves back to that IP with no DNS setup on your end. See
# backend/README.md for the full walkthrough.
#
# Usage (from this backend/ directory, on the deployment VM):
#   DOMAIN=your-host.sslip.io ALLOWED_ORIGINS=https://aminullah112-oss.github.io \
#       docker compose up -d --build

services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN, e.g. 203-0-113-10.sslip.io -- see backend/README.md}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
