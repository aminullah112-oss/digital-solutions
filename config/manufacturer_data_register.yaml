    data'
  engineering_impact: Converts kVA to engine kW. The engine kW loading in the double-contingency case is 84.0 %, above the 80 % target, with the
    placeholder 0.8.
  verification_action: Enter the rated power factor, engine kW and alternator kVA.
  datasheet_reference: null
  verified_by: null
  verification_date: null
