# Manufacturer-data register: what each manufacturer-specific input needs, which equipment it concerns, and the open verification action.
# The CURRENT VALUE, SOURCE AND STATUS are read live from the master configuration, so this file never holds a second copy of a value.
# Every parameter with status MANUFACTURER_DATA, or flagged requires_manufacturer_verification, must have an entry (the QA check fails otherwise).
# datasheet_reference, verified_by and verification_date are filled by a reviewer only after the configuration holds real manufacturer data.
# A placeholder is never treated as validated equipment data: a verified_by on an entry whose value is still a placeholder is a QA failure.
schema_version: 1
entries:
- parameter: equipment.transformer_rating
  equipment_tags: &id001
  - TX-A1
  - TX-B1
  required_datasheet: 'Transformer data sheet: rating by cooling stage, short-circuit impedance, type-test and loss report'
  engineering_impact: Sets the transformer loading in the worst contingency (91.0 % today, a design-target exception) and the LV current and fault
    level.
  verification_action: Confirm the continuous rating on the applicable cooling stage at the site conditions.
  datasheet_reference: null
  verified_by: null
  verification_date: null
- parameter: equipment.transformer_impedance
  equipment_tags: *id001
  required_datasheet: 'Transformer data sheet: rating by cooling stage, short-circuit impedance, type-test and loss report'
  engineering_impact: Sets the prospective fault level at 400 V and every downstream short-circuit rating. Without it the transformer-limited
    bound is NOT CALCULATED.
  verification_action: Enter the guaranteed impedance and tolerance.
  datasheet_reference: null
  verified_by: null
  verification_date: null
- parameter: equipment.generator_rating
  equipment_tags: &id002
  - GEN-A1
  - GEN-A2
  - GEN-A3
  - GEN-B1
  - GEN-B2
  - GEN-B3
  required_datasheet: 'Generator set data sheet: ISO 8528 rating basis (PRP, ESP, COP) in kW and kVA, site derating curves, transient and step-load
    data'
  engineering_impact: Sets generator loading and N+1 capacity. The 2,000 kVA is assumed to be PRP and is NOT confirmed.
  verification_action: Obtain the data sheet stating the ISO 8528 basis, kVA, kW and site derating.
  datasheet_reference: null
  verified_by: null
  verification_date: null
- parameter: equipment.generator_rating_power_factor
  equipment_tags: *id002
