# Edition, scope and applicability are NOT_VERIFIED until a reviewer checks the current edition and local requirements.
# Local requirements (for example Saudi Building Code, utility and civil defence rules) must be added by the project team. None are invented here.
# Revision A6 rules: (1) standards are NAMED, never quoted. No clause, table or equation number is cited anywhere in the package: take them from the edition in force.
# (2) `edition` stays null until a reviewer records it (with the attestation record in models/attestation.py). (3) `package_use` says how the package uses the standard,
# including where it is named only to say that compliance is NOT claimed or the topic is OUT OF SCOPE. (4) Every standard named in a specification must appear here (tested).
