    generator_quantity_per_path:
      name: Generators per power path
      value: 3
      unit: '-'
      description: Number of generators in each power path, including the redundant unit.
      source: Master prompt OHM-DC-2000, section 4
      status: ASSUMPTION
      revision: A0
      notes: Concept "3 x 2,000 kVA per path".
    generator_rating:
      name: Generator PRP rating (each)
      value: 2000
      unit: kVA
      description: ISO 8528 Prime Power (PRP) rating of each generator, in kVA. It is the default sizing basis.
      source: Master prompt OHM-DC-2000, section 4
      status: ASSUMPTION
      revision: A0
      notes: Assumed to be a PRP rating. NOT confirmed by manufacturer documentation. Illustrative, NOT manufacturer data. Replace with
        the manufacturer's PRP rating at the site conditions.
      requires_manufacturer_verification: true
    ups_quantity:
      name: UPS quantity (total)
      value: 2
      unit: '-'
      description: Total number of UPS systems in the concept.
      source: Master prompt OHM-DC-2000, section 4
      status: ASSUMPTION
      revision: A0
      notes: Concept "2 x 2,500 kW".
    ups_rating:
      name: UPS rating
      value: 2500
      unit: kW
      description: Rated active power of each UPS.
      source: Master prompt OHM-DC-2000, section 4
      status: ASSUMPTION
      revision: A0
      notes: ''
      requires_manufacturer_verification: true
    transformer_impedance:
      name: Transformer impedance
      value: 6
      unit: '%'
      description: Per-unit short-circuit impedance of the transformer.
      source: 'Ohmetry preliminary concept value, retained by the project owner on 2026-11-05. NOT manufacturer data.'
      status: ASSUMPTION
      revision: A0
      notes: 'Preliminary assumption (UNVERIFIED_PLACEHOLDER). Replace with the transformer test report value; the short-circuit results then update.'
      needed_from_stage: 5
      requires_manufacturer_verification: true
    ups_efficiency:
      name: UPS efficiency
      value: 96
      unit: '%'
      description: UPS efficiency at the operating load, used for UPS losses in the load model.
      source: 'Ohmetry illustrative assumption for the sample project (project owner instruction: ideal conditions)'
      status: ASSUMPTION
      revision: A0
      notes: Illustrative value, NOT manufacturer data. Replace with the data sheet value at the actual operating load.
      requires_manufacturer_verification: true
    generator_esp_rating:
      name: Generator ESP rating (each)
      value: null
      unit: kVA
      description: ISO 8528 Emergency Standby Power (ESP) rating, used only if the ESP basis is selected.
      source: Manufacturer data pending
      status: MANUFACTURER_DATA
      revision: A1
      notes: Not assumed. ESP is not a basis for prolonged outages.
      needed_from_stage: 3
      required: false
    generator_cop_rating:
      name: Generator COP rating (each)
      value: null
      unit: kVA
      description: ISO 8528 Continuous Power (COP) rating, used only if the COP basis is selected.
      source: Manufacturer data pending
      status: MANUFACTURER_DATA
      revision: A1
      notes: Not assumed.
      needed_from_stage: 3
