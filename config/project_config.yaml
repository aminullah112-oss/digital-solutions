# OHM-DC-2000 master configuration. Every value is a PRELIMINARY ILLUSTRATIVE ASSUMPTION unless its status says otherwise.
# Nothing in this file is an approved design selection. Values that were not supplied are null and are reported as missing,
# never replaced with a default. Status: USER_INPUT, ASSUMPTION, MANUFACTURER_DATA or REFERENCE.
# needed_from_stage: the development stage that first needs the input. Earlier stages report it as deferred, not as a failure.
# demand_data is the single place to enter new load figures: general.* reads from it.
schema_version: 1
project:
  code: OHM-DC-2000
  name: OHMETRY 2 MW DATA CENTRE ELECTRICAL ENGINEERING PROJECT
  product_code: OHM-DC-2000
  edition: Professional Edition + Engineering Learning Suite
  revision: A6
  release_state: DEVELOPMENT
  current_stage: 5
sections:
  general:
    it_critical_load:
      name: IT critical load
      unit: kW
      description: Total IT critical load at the design point.
      source: Master prompt OHM-DC-2000, section 4
      status: ASSUMPTION
      revision: A0
      notes: Must be confirmed against the Stage 2 load model. Read from the demand data section.
      value_ref: demand_data.it_critical_load_kw
    target_pue:
      name: Target PUE
      value: 1.35
      unit: '-'
      description: Target power usage effectiveness (total facility energy divided by IT energy).
      source: Master prompt OHM-DC-2000, section 4
      status: ASSUMPTION
      revision: A0
      notes: A target, not a result. The Stage 2 load model must show whether it is achievable.
    estimated_facility_demand:
      name: Initial estimated total facility demand
      unit: kW
      description: Initial estimate of total facility demand.
      source: Master prompt OHM-DC-2000, section 4
      status: ASSUMPTION
      revision: A0
      notes: Initial estimate only. It must be replaced by the load model result, not forced to match it. Read from the demand data
        section.
      value_ref: demand_data.facility_demand_estimate_kw
    design_power_factor:
      name: Initial design power factor
      value: 0.95
      unit: '-'
      description: Overall power factor used for kW to kVA conversion in preliminary checks.
      source: Master prompt OHM-DC-2000, section 4
      status: ASSUMPTION
      revision: A0
      notes: ''
    future_expansion_allowance:
      name: Future expansion allowance
      value: 0
      unit: '%'
      description: Allowance for future load growth.
      source: 'Ohmetry illustrative assumption for the sample project (project owner instruction: ideal conditions)'
      status: ASSUMPTION
      revision: A0
      notes: 'No growth allowance is applied in this sample. This is an explicit choice, not a default: set the project''s value.'
  electrical_system:
    mv_supply_voltage:
      name: Incoming MV supply voltage
      value: 13.8
      unit: kV
      description: Nominal line-to-line voltage of the incoming medium-voltage supply.
      source: Master prompt OHM-DC-2000, section 4
      status: ASSUMPTION
      revision: A0
      notes: Confirm with the serving utility.
    lv_line_voltage:
      name: LV line-to-line voltage
      value: 400
      unit: V
      description: Nominal LV line-to-line voltage, three-phase.
      source: Master prompt OHM-DC-2000, section 4
      status: ASSUMPTION
      revision: A0
      notes: See ENGINEERING_REVIEW_LOG.md item ER-001 on the pairing with the frequency.
    lv_phase_voltage:
      name: LV line-to-neutral voltage
      value: 230
      unit: V
      description: Nominal LV line-to-neutral voltage.
      source: Master prompt OHM-DC-2000, section 4
      status: ASSUMPTION
      revision: A0
      notes: ''
    frequency:
      name: System frequency
      value: 60
      unit: Hz
      description: Nominal system frequency.
      source: Master prompt OHM-DC-2000, section 4
      status: ASSUMPTION
      revision: A0
      notes: See ENGINEERING_REVIEW_LOG.md item ER-001.
    voltage_frequency_basis:
      name: Basis for the LV voltage and frequency pairing
      value: Project owner selected 400/230 V at 60 Hz for this reference project and stated that the serving utility confirmed it.
        Not independently verified.
      unit: '-'
      description: Records who decided the voltage and frequency pairing flagged as ER-001.
      source: Project owner decision, recorded 2026-11-05
      status: USER_INPUT
      revision: A0
      notes: For a real project, the serving utility's written confirmation is required.
  redundancy:
    architecture:
      name: Power architecture
      value: Dual independent A and B power paths
      unit: '-'
      description: Top-level distribution architecture concept.
      source: Master prompt OHM-DC-2000, section 4
      status: ASSUMPTION
      revision: A0
      notes: ''
    power_paths:
      name: Number of independent power paths
      value: 2
      unit: '-'
      description: Number of independent power paths implied by the architecture.
      source: Derived from "Dual independent A and B power paths"
      status: ASSUMPTION
      revision: A0
      notes: ''
    ups_topology:
      name: UPS topology
      value: 2N
      unit: '-'
      description: UPS redundancy concept. In 2N each path can carry the full IT load.
      source: Master prompt OHM-DC-2000, section 4
      status: ASSUMPTION
      revision: A0
      notes: ''
    generator_concept:
      name: Generator concept
      value: N+1 per power path
      unit: '-'
      description: Generator redundancy concept in each path.
      source: Master prompt OHM-DC-2000, section 4
      status: ASSUMPTION
      revision: A0
      notes: ''
    battery_autonomy:
      name: Battery autonomy target
      value: 10
      unit: min
      description: Autonomy at end of battery life.
      source: Master prompt OHM-DC-2000, section 4
      status: ASSUMPTION
      revision: A0
      notes: Battery sizing needs manufacturer discharge data (Stage 3).
    double_contingency_credible:
      name: Double contingency treated as credible
      value: false
      unit: '-'
      description: Whether loss of a path together with loss of a redundant unit is treated as a credible design case.
      source: Ohmetry default for an N+1 and 2N concept
      status: ASSUMPTION
      revision: A1
      notes: 'False: that case is reported as informational and is not judged against the limits. Set True to judge it. The loss of
        the other path together with the loss of the largest generator is always shown in the generator verification table, whatever
        this flag says.'
      needed_from_stage: 3
  design_criteria:
    transformer_max_loading:
      name: Transformer max loading
      value: 100
      unit: '%'
      description: 'Loading policy: transformer maximum continuous loading, of the derated continuous rating. Applied to the worst credible
        contingency.'
      source: 'Project owner decision, 2026-11-05: preliminary Ohmetry design policy, not a universal IEC acceptance limit'
      status: USER_INPUT
      revision: A1
      notes: Above the target gives WARNING. Above the maximum gives FAIL. Short-duration overload capability is never used to justify
        continuous loading. Configurable.
      needed_from_stage: 3
    ups_max_loading:
      name: Ups max loading
      value: 100
      unit: '%'
      description: 'Loading policy: UPS maximum continuous loading, of the derated continuous kW and kVA capability. Applied to the
        worst credible contingency.'
      source: 'Project owner decision, 2026-11-05: preliminary Ohmetry design policy, not a universal IEC acceptance limit'
      status: USER_INPUT
      revision: A1
      notes: Above the target gives WARNING. Above the maximum gives FAIL. Short-duration overload capability is never used to justify
        continuous loading. Configurable.
      needed_from_stage: 3
    generator_max_loading:
      name: Generator max loading
      value: 100
      unit: '%'
      description: 'Loading policy: generator maximum continuous loading, of the derated PRP rating. Applied to the worst credible contingency.'
      source: 'Project owner decision, 2026-11-05: preliminary Ohmetry design policy, not a universal IEC acceptance limit'
      status: USER_INPUT
      revision: A1
      notes: Above the target gives WARNING. Above the maximum gives FAIL. Short-duration overload capability is never used to justify
        continuous loading. Configurable.
      needed_from_stage: 3
    transformer_target_loading:
      name: Transformer target loading
      value: 90
      unit: '%'
      description: 'Loading policy: transformer preferred design target. Applied to the worst credible contingency.'
      source: 'Project owner decision, 2026-11-05: preliminary Ohmetry design policy, not a universal IEC acceptance limit'
      status: USER_INPUT
      revision: A1
      notes: Above the target gives WARNING. Above the maximum gives FAIL. Short-duration overload capability is never used to justify
        continuous loading. Configurable.
      needed_from_stage: 3
    ups_target_loading:
      name: Ups target loading
      value: 80
      unit: '%'
      description: 'Loading policy: UPS preferred design target. Applied to the worst credible contingency.'
      source: 'Project owner decision, 2026-11-05: preliminary Ohmetry design policy, not a universal IEC acceptance limit'
      status: USER_INPUT
      revision: A1
      notes: Above the target gives WARNING. Above the maximum gives FAIL. Short-duration overload capability is never used to justify
        continuous loading. Configurable.
      needed_from_stage: 3
    generator_target_loading:
      name: Generator target loading
      value: 80
      unit: '%'
      description: 'Loading policy: generator preferred design target. Applied to the worst credible contingency.'
      source: 'Project owner decision, 2026-11-05: preliminary Ohmetry design policy, not a universal IEC acceptance limit'
      status: USER_INPUT
      revision: A1
      notes: Above the target gives WARNING. Above the maximum gives FAIL. Short-duration overload capability is never used to justify
        continuous loading. Configurable.
      needed_from_stage: 3
    voltage_drop_limit_pct:
      name: Maximum voltage drop per feeder
      value: 3.0
      unit: '%'
      description: Maximum voltage drop of a feeder in the design condition, as a percentage of the nominal voltage.
      source: 'Ohmetry illustrative assumption for the sample project (project owner instruction: proceed with placeholders where manufacturer
        data is unavailable)'
      status: ASSUMPTION
      revision: A2
      notes: 'Placeholder: the project criterion was not supplied. Replace with the project requirement.'
      needed_from_stage: 4
    cable_max_loading:
      name: Maximum cable loading
      value: 100.0
      unit: '%'
      description: Maximum loading of a cable run against its derated tabulated current rating.
      source: 'Ohmetry illustrative assumption for the sample project (project owner instruction: proceed with placeholders where manufacturer
        data is unavailable)'
      status: ASSUMPTION
      revision: A2
      notes: 'Placeholder: the project criterion was not supplied. Above it gives FAIL. There is no separate preferred target for cables.'
      needed_from_stage: 4
    busduct_max_loading:
      name: Maximum busduct loading
      value: 100.0
      unit: '%'
      description: Maximum loading of a busduct against its derated rated current.
      source: 'Ohmetry illustrative assumption for the sample project (project owner instruction: proceed with placeholders where manufacturer
        data is unavailable)'
      status: ASSUMPTION
      revision: A2
      notes: 'Placeholder: the project criterion was not supplied.'
      needed_from_stage: 4
    switchgear_max_loading:
      name: Maximum switchgear busbar loading
      value: 100.0
      unit: '%'
      description: Maximum loading of switchgear busbars against their derated rated current.
      source: 'Ohmetry illustrative assumption for the sample project (project owner instruction: proceed with placeholders where manufacturer
        data is unavailable)'
      status: ASSUMPTION
      revision: A2
      notes: 'Placeholder: the project criterion was not supplied.'
      needed_from_stage: 4
  equipment:
    transformer_quantity:
      name: Transformer quantity (total)
      value: 2
      unit: '-'
      description: Total number of MV/LV transformers in the concept.
      source: Master prompt OHM-DC-2000, section 4
